name: Generate animated profile artwork

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/generate_profile_art.py"
      - ".github/workflows/profile-art.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools and royal serif font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ebgaramond
          python -m pip install --upgrade pip
          python -m pip install Pillow
          fc-cache -f

      - name: Generate looping GIF assets
        run: python assets/generate_profile_art.py

      - name: Publish GIFs to the media branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: media
          build_dir: assets/generated
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
